<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Oops! - Zaydio</title>
    <link rel="icon" type="image/png" href="ZAYDIOLOGO.png">
    <link rel="apple-touch-icon" href="ZAYDIOLOGO.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #6C5CE7 0%, #4ECDC4 50%, #FFD93D 100%);
            color: #ffffff;
            text-align: center;
            padding: 30px;
            overflow: hidden;
            position: relative;
        }
        .floating-notes {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .floating-notes span {
            position: absolute;
            font-size: 2rem;
            opacity: 0.15;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.15; }
            90% { opacity: 0.15; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        .content {
            position: relative;
            z-index: 1;
            max-width: 500px;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 30px;
            animation: logoBounce 2s ease-in-out infinite;
        }
        @keyframes logoBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .error-code {
            font-size: 8rem;
            font-weight: 700;
            line-height: 1;
            text-shadow: 4px 6px 12px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-message {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .home-btn {
            display: inline-block;
            padding: 16px 40px;
            background: #ffffff;
            color: #6C5CE7;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .home-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        @media screen and (max-width: 480px) {
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.3rem; }
            .error-message { font-size: 1rem; }
            .logo { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>
    <div class="floating-notes">
        <span style="left:5%; animation-duration:8s; animation-delay:0s; font-size:2.5rem;">&#9835;</span>
        <span style="left:15%; animation-duration:12s; animation-delay:2s;">&#9834;</span>
        <span style="left:28%; animation-duration:10s; animation-delay:4s; font-size:1.8rem;">&#9833;</span>
        <span style="left:40%; animation-duration:9s; animation-delay:1s; font-size:3rem;">&#9835;</span>
        <span style="left:55%; animation-duration:11s; animation-delay:3s;">&#9834;</span>
        <span style="left:68%; animation-duration:8.5s; animation-delay:5s; font-size:2.2rem;">&#9833;</span>
        <span style="left:80%; animation-duration:10.5s; animation-delay:0.5s;">&#9835;</span>
        <span style="left:92%; animation-duration:9.5s; animation-delay:2.5s; font-size:2.8rem;">&#9834;</span>
    </div>

    <div class="content">
        <img src="ZAYDIOLOGO.png" alt="Zaydio" class="logo" width="120" height="120">
        <div class="error-code">404</div>
        <h1 class="error-title">Oops! This page went on an adventure!</h1>
        <p class="error-message">Looks like this page wandered off to explore. Let's get you back to the fun!</p>
        <a href="/" class="home-btn">&#127925; Back to Zaydio</a>
    </div>
</body>
</html>
