<!-- ============================================================
  ZAYDIO SHORTS CAROUSEL — drop-in section for videos.html
  Apple-services-style snap carousel of vertical YouTube Shorts.
  Auto-pulls from the @zaydioandpals channel via YouTube Data API,
  falls back to hard-coded IDs if no key / API fails.
  Paste this entire block where you want the section to appear.
  ============================================================ -->
<section class="zshorts" id="zaydio-shorts" aria-label="Zaydio YouTube Shorts">
  <style>
    /* ---- Zaydio Shorts Carousel (scoped: .zshorts) ---- */
    .zshorts{
      --z-teal:#4ECDC4; --z-coral:#FF6B6B; --z-sun:#FFD93D; --z-ink:#1d3557;
      position:relative; padding:56px 0 64px; overflow:hidden;
      background:linear-gradient(180deg,#fdfefe 0%,#e9faf8 100%);
      font-family:inherit;
    }
    .zshorts__head{
      max-width:1100px; margin:0 auto 8px; padding:0 22px;
      display:-webkit-box; display:-ms-flexbox; display:flex;
      -ms-flex-align:end; align-items:flex-end;
      -ms-flex-pack:justify; justify-content:space-between;
      -ms-flex-wrap:wrap; flex-wrap:wrap; gap:12px;
    }
    .zshorts__title{
      margin:0; font-size:clamp(1.7rem,4vw,2.5rem); line-height:1.1;
      color:var(--z-ink); letter-spacing:-.01em;
    }
    .zshorts__title .note{ color:var(--z-teal); display:inline-block;
      -webkit-animation:zbob 2.4s ease-in-out infinite; animation:zbob 2.4s ease-in-out infinite; }
    @-webkit-keyframes zbob{ 0%,100%{-webkit-transform:translateY(0)} 50%{-webkit-transform:translateY(-6px) rotate(-8deg)} }
    @keyframes zbob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px) rotate(-8deg)} }
    .zshorts__sub{ margin:6px 0 0; color:#4a6572; font-size:1.02rem; }
    .zshorts__cta{
      display:inline-block; background:var(--z-coral); color:#fff; text-decoration:none;
      font-weight:700; padding:10px 20px; border-radius:999px; white-space:nowrap;
      -webkit-transition:transform .2s ease, box-shadow .2s ease; transition:transform .2s ease, box-shadow .2s ease;
      box-shadow:0 4px 14px rgba(255,107,107,.35);
    }
    .zshorts__cta:hover,.zshorts__cta:focus{ -webkit-transform:translateY(-2px) scale(1.03); transform:translateY(-2px) scale(1.03); box-shadow:0 8px 20px rgba(255,107,107,.45); }

    /* track */
    .zshorts__viewport{ position:relative; }
    .zshorts__track{
      display:-webkit-box; display:-ms-flexbox; display:flex;
      gap:18px; overflow-x:auto; overflow-y:hidden;
      padding:26px max(22px, calc((100vw - 1100px)/2)) 30px;
      -webkit-overflow-scrolling:touch;              /* iOS momentum */
      scroll-snap-type:x mandatory;                  /* modern browsers */
      scroll-behavior:smooth;
      scrollbar-width:none;                          /* Firefox */
      -ms-overflow-style:none;                       /* old Edge/IE */
    }
    .zshorts__track::-webkit-scrollbar{ display:none; } /* Chrome/Safari */

    /* card — fixed sizes per breakpoint (bulletproof across browsers, no aspect-ratio needed) */
    .zshorts__card{
      position:relative; -ms-flex-negative:0; flex-shrink:0;
      width:230px; height:409px;                     /* 9:16 */
      scroll-snap-align:center;
      border-radius:22px; overflow:hidden; text-decoration:none;
      background:#0f2536;
      box-shadow:0 10px 26px rgba(29,53,87,.18);
      -webkit-transition:transform .25s ease, box-shadow .25s ease; transition:transform .25s ease, box-shadow .25s ease;
      outline-offset:4px;
    }
    .zshorts__card:hover,.zshorts__card:focus{
      -webkit-transform:translateY(-8px) rotate(-1deg) scale(1.02);
      transform:translateY(-8px) rotate(-1deg) scale(1.02);
      box-shadow:0 18px 38px rgba(29,53,87,.28);
    }
    @media (max-width:640px){ .zshorts__card{ width:186px; height:331px; } .zshorts__track{ gap:14px; } }
    @media (min-width:1200px){ .zshorts__card{ width:250px; height:444px; } }

    .zshorts__poster{
      position:absolute; top:0; left:0; width:100%; height:100%;
    }
    .zshorts__thumb{
      width:100%; height:100%; -o-object-fit:cover; object-fit:cover; display:block;
      -webkit-transition:opacity .25s ease; transition:opacity .25s ease;
    }
    .zshorts__embed{
      position:absolute; top:0; left:0; width:100%; height:100%;
      opacity:0; pointer-events:none;
      -webkit-transition:opacity .25s ease; transition:opacity .25s ease;
    }
    .zshorts__embed iframe{
      position:absolute; top:0; left:0; width:100%; height:100%;
      border:0; pointer-events:none;
    }
    .zshorts__card.is-active .zshorts__thumb{ opacity:0; }
    .zshorts__card.is-active .zshorts__embed{ opacity:1; }
    .zshorts__card.is-active .zshorts__play{ opacity:0; }
    .zshorts__scrim{
      position:absolute; left:0; right:0; bottom:0; height:55%;
      background:linear-gradient(180deg,rgba(15,37,54,0) 0%,rgba(15,37,54,.85) 100%);
      pointer-events:none;
    }
    .zshorts__cardtitle{
      position:absolute; left:14px; right:14px; bottom:14px;
      color:#fff; font-weight:700; font-size:.95rem; line-height:1.3;
      display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
      text-shadow:0 1px 6px rgba(0,0,0,.4);
    }
    .zshorts__play{
      position:absolute; top:12px; right:12px; width:38px; height:38px; border-radius:50%;
      background:rgba(255,255,255,.92); color:var(--z-coral);
      display:-webkit-box; display:-ms-flexbox; display:flex;
      -ms-flex-align:center; align-items:center; -ms-flex-pack:center; justify-content:center;
      font-size:15px; box-shadow:0 3px 10px rgba(0,0,0,.25); pointer-events:none;
      -webkit-transition:opacity .25s ease; transition:opacity .25s ease;
    }
    .zshorts__play svg{ display:block; margin-left:2px; }

    /* Apple-style paddles */
    .zshorts__paddle{
      position:absolute; top:50%; margin-top:-24px; z-index:5;
      width:48px; height:48px; border-radius:50%; border:0; cursor:pointer;
      background:rgba(255,255,255,.95); color:var(--z-ink);
      box-shadow:0 4px 16px rgba(29,53,87,.22);
      display:-webkit-box; display:-ms-flexbox; display:flex;
      -ms-flex-align:center; align-items:center; -ms-flex-pack:center; justify-content:center;
      -webkit-transition:transform .15s ease, opacity .2s ease, background .2s ease; transition:transform .15s ease, opacity .2s ease, background .2s ease;
    }
    .zshorts__paddle:hover{ background:var(--z-sun); -webkit-transform:scale(1.08); transform:scale(1.08); }
    .zshorts__paddle[disabled]{ opacity:0; pointer-events:none; }
    .zshorts__paddle--prev{ left:14px; }
    .zshorts__paddle--next{ right:14px; }
    @media (hover:none){ .zshorts__paddle{ display:none; } } /* touch devices: swipe instead */

    /* edge fades like Apple */
    .zshorts__viewport::before,.zshorts__viewport::after{
      content:""; position:absolute; top:0; bottom:0; width:56px; z-index:3; pointer-events:none;
    }
    .zshorts__viewport::before{ left:0; background:linear-gradient(90deg,rgba(233,250,248,.95),rgba(233,250,248,0)); }
    .zshorts__viewport::after{ right:0; background:linear-gradient(270deg,rgba(233,250,248,.95),rgba(233,250,248,0)); }
    @media (max-width:640px){ .zshorts__viewport::before,.zshorts__viewport::after{ width:20px; } }

    .zshorts__status{ text-align:center; color:#4a6572; padding:30px 20px; }
    @media (prefers-reduced-motion:reduce){
      .zshorts *{ -webkit-animation:none!important; animation:none!important; -webkit-transition:none!important; transition:none!important; }
      .zshorts__track{ scroll-behavior:auto; }
    }
  </style>

  <div class="zshorts__head">
    <div>
      <h2 class="zshorts__title"><span class="note">&#9835;</span> Zaydio Shorts</h2>
      <p class="zshorts__sub">Quick bursts of singing, dancing, and giggles — fresh from our YouTube channel!</p>
    </div>
    <a class="zshorts__cta" href="https://www.youtube.com/@zaydioandpals/shorts" target="_blank" rel="noopener">Watch all Shorts &#9654;</a>
  </div>

  <div class="zshorts__viewport">
    <button class="zshorts__paddle zshorts__paddle--prev" type="button" aria-label="Scroll to previous shorts" disabled>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="zshorts__track" tabindex="0" aria-label="Zaydio Shorts carousel — scroll for more">
      <p class="zshorts__status">Loading shorts&hellip; &#127925;</p>
    </div>
    <button class="zshorts__paddle zshorts__paddle--next" type="button" aria-label="Scroll to next shorts">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>

  <script>
  (function () {
    'use strict';

    /* ================= CONFIG ================= */
    var YT_API_KEY = '';                                   /* <-- paste your YouTube Data API v3 key (referrer-restricted to zaydio.com) */
    var SHORTS_PLAYLIST  = 'UUSH4p-Lx9r0WZ3AGI7tRuWOYA';   /* auto-generated Shorts-only playlist for @zaydioandpals */
    var UPLOADS_PLAYLIST = 'UU4p-Lx9r0WZ3AGI7tRuWOYA';     /* all uploads (fallback if shorts playlist is empty) */
    var MAX_SHORTS = 12;
    var CACHE_HOURS = 6;
    var AUTO_MS_DESKTOP = 5000;
    var AUTO_MS_MOBILE = 5000;
    /* Fallback shorts if there's no API key or the request fails.
       Add IDs from youtube.com/shorts/<ID> — the section hides itself if this is empty AND the API is unavailable. */
    var FALLBACK = [
      { id: 'lqYquU6T0dw', title: 'Birds Eat Worms' },
      { id: 'r-OMWIJDBPA', title: 'Grow Flower Grow!' },
      { id: 'LOzbUdVu-6M', title: '4 Seasons' },
      { id: 'Ke5tVja1XN4', title: "Let's Learn Colors!" },
      { id: 'MvTdeHemgkk', title: 'Cloudy with a Chance of ZAYDIO' },
      { id: 'm5PDUSBkiPQ', title: 'Farm Animal Sounds' },
      { id: 'XvPTSOPO52c', title: 'Burbles' },
      { id: 'MN8Oa6baxIE', title: 'Colors Make Colours!' },
      { id: '3p6lZV-THvY', title: 'Cloudy With a Chance of Zaydio' },
    ];
    /* ========================================== */

    var root    = document.getElementById('zaydio-shorts');
    var track   = root.querySelector('.zshorts__track');
    var prevBtn = root.querySelector('.zshorts__paddle--prev');
    var nextBtn = root.querySelector('.zshorts__paddle--next');

    var activeIndex = 0;
    var reelTimer = null;
    var resumeTimer = null;
    var scrollSyncTimer = null;
    var pauseHover = false;
    var isDesktop = false;
    var reducedMotion = false;

    try {
      isDesktop = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
      reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    } catch (e) {}

    function getCards(){
      return track.querySelectorAll('.zshorts__card');
    }

    function embedUrl(id){
      return 'https://www.youtube.com/embed/' + id
        + '?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&playsinline=1'
        + '&loop=1&playlist=' + id;
    }

    function deactivateAll(){
      var cards = getCards();
      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('is-active');
        var embed = cards[i].querySelector('.zshorts__embed');
        if (embed) embed.innerHTML = '';
      }
    }

    function activateCard(card){
      if (!card) return;
      deactivateAll();
      card.classList.add('is-active');
      var embed = card.querySelector('.zshorts__embed');
      var id = card.getAttribute('data-video-id');
      if (!embed || !id) return;
      if (!embed.querySelector('iframe')) {
        var iframe = document.createElement('iframe');
        iframe.src = embedUrl(id);
        iframe.title = card.getAttribute('aria-label') || 'Zaydio short preview';
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        iframe.setAttribute('allowfullscreen', '');
        iframe.setAttribute('loading', 'lazy');
        iframe.setAttribute('tabindex', '-1');
        embed.appendChild(iframe);
      }
      var cards = getCards();
      for (var j = 0; j < cards.length; j++) {
        if (cards[j] === card) { activeIndex = j; break; }
      }
    }

    function getNearestCenteredCard(){
      var cards = getCards();
      if (!cards.length) return null;
      var trackRect = track.getBoundingClientRect();
      var center = trackRect.left + trackRect.width / 2;
      var best = cards[0];
      var bestDist = Infinity;
      for (var i = 0; i < cards.length; i++) {
        var r = cards[i].getBoundingClientRect();
        var cardCenter = r.left + r.width / 2;
        var dist = Math.abs(cardCenter - center);
        if (dist < bestDist) {
          bestDist = dist;
          best = cards[i];
        }
      }
      return best;
    }

    function stopReel(){
      if (reelTimer) {
        clearTimeout(reelTimer);
        reelTimer = null;
      }
    }

    function scheduleNext(){
      stopReel();
      if (reducedMotion || document.hidden || pauseHover) return;
      var ms = isDesktop ? AUTO_MS_DESKTOP : AUTO_MS_MOBILE;
      reelTimer = setTimeout(function(){
        advanceReel();
        scheduleNext();
      }, ms);
    }

    function startReel(){
      scheduleNext();
    }

    function advanceReel(){
      var cards = getCards();
      if (!cards.length) return;
      activeIndex = (activeIndex + 1) % cards.length;
      var card = cards[activeIndex];
      if (card.scrollIntoView) {
        try {
          card.scrollIntoView({ inline: 'center', behavior: 'smooth' });
        } catch (e) {
          card.scrollIntoView(true);
        }
      }
      activateCard(card);
      updatePaddles();
    }

    function syncActiveFromScroll(){
      var nearest = getNearestCenteredCard();
      if (!nearest) return;
      activateCard(nearest);
      if (!pauseHover && !reducedMotion && !document.hidden) {
        stopReel();
        startReel();
      }
    }

    function bindCardHovers(){
      if (!isDesktop) return;
      var cards = getCards();
      for (var i = 0; i < cards.length; i++) {
        cards[i].addEventListener('mouseenter', function(){
          pauseHover = true;
          stopReel();
          activateCard(this);
        });
        cards[i].addEventListener('mouseleave', function(){
          pauseHover = false;
          if (resumeTimer) clearTimeout(resumeTimer);
          resumeTimer = setTimeout(function(){
            if (!pauseHover && !reducedMotion && !document.hidden) {
              syncActiveFromScroll();
              startReel();
            }
          }, 300);
        });
      }
    }

    function initReel(){
      var cards = getCards();
      if (!cards.length) return;
      activeIndex = 0;
      if (cards[0].scrollIntoView) {
        try {
          cards[0].scrollIntoView({ inline: 'center', behavior: 'auto' });
        } catch (e) {
          cards[0].scrollIntoView(true);
        }
      }
      activateCard(cards[0]);
      bindCardHovers();
      updatePaddles();
      if (!reducedMotion) startReel();
    }

    /* safe localStorage (Safari private mode throws) */
    function cacheGet(k){ try{ var raw=localStorage.getItem(k); if(!raw) return null;
      var o=JSON.parse(raw); if(Date.now()-o.t > CACHE_HOURS*36e5) return null; return o.v; }catch(e){ return null; } }
    function cacheSet(k,v){ try{ localStorage.setItem(k, JSON.stringify({t:Date.now(), v:v})); }catch(e){} }

    function apiUrl(playlistId){
      return 'https://www.googleapis.com/youtube/v3/playlistItems'
        + '?part=snippet&maxResults=' + MAX_SHORTS
        + '&playlistId=' + playlistId + '&key=' + YT_API_KEY;
    }

    function fetchPlaylist(playlistId){
      return fetch(apiUrl(playlistId)).then(function(r){
        if(!r.ok) throw new Error('YT API ' + r.status);
        return r.json();
      }).then(function(data){
        var items = (data.items || []).map(function(it){
          var s = it.snippet || {};
          return { id: (s.resourceId||{}).videoId, title: s.title || 'Zaydio Short' };
        }).filter(function(v){ return v.id; });
        return items;
      });
    }

    function loadShorts(){
      var cached = cacheGet('zshorts');
      if(cached && cached.length){ return Promise.resolve(cached); }
      if(!YT_API_KEY){ return Promise.resolve(FALLBACK); }
      return fetchPlaylist(SHORTS_PLAYLIST)
        .then(function(items){ return items.length ? items : fetchPlaylist(UPLOADS_PLAYLIST); })
        .then(function(items){ if(items.length) cacheSet('zshorts', items); return items.length ? items : FALLBACK; })
        .catch(function(){ return FALLBACK; });
    }

    function render(videos){
      if(!videos.length){ root.style.display='none'; return; }
      stopReel();
      track.innerHTML = '';
      var frag = document.createDocumentFragment();
      videos.forEach(function(v){
        var a = document.createElement('a');
        a.className = 'zshorts__card';
        a.href = 'https://www.youtube.com/shorts/' + v.id;
        a.target = '_blank'; a.rel = 'noopener';
        a.setAttribute('data-video-id', v.id);
        a.setAttribute('aria-label', 'Watch on YouTube: ' + v.title);

        var poster = document.createElement('div');
        poster.className = 'zshorts__poster';

        var img = document.createElement('img');
        img.className = 'zshorts__thumb';
        img.alt = v.title + ' — Zaydio kids music short';
        img.loading = 'lazy'; img.decoding = 'async';
        img.src = 'https://i.ytimg.com/vi/' + v.id + '/oardefault.jpg';
        img.onerror = function(){ this.onerror=null; this.src='https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg'; };

        var embed = document.createElement('div');
        embed.className = 'zshorts__embed';

        poster.appendChild(img);
        poster.appendChild(embed);

        var scrim = document.createElement('div'); scrim.className='zshorts__scrim';
        var t = document.createElement('div'); t.className='zshorts__cardtitle'; t.textContent = v.title;
        var play = document.createElement('div'); play.className='zshorts__play';
        play.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';

        a.appendChild(poster); a.appendChild(scrim); a.appendChild(t); a.appendChild(play);
        frag.appendChild(a);
      });
      track.appendChild(frag);
      injectSchema(videos);
      initReel();
    }

    /* paddles */
    function scrollAmount(){
      var card = track.querySelector('.zshorts__card');
      return card ? (card.offsetWidth + 18) * 2 : track.clientWidth * 0.8;
    }
    function doScroll(dir){
      stopReel();
      var x = dir * scrollAmount();
      if('scrollBehavior' in document.documentElement.style){ track.scrollBy({left:x, behavior:'smooth'}); }
      else { track.scrollLeft += x; }
    }
    function updatePaddles(){
      var max = track.scrollWidth - track.clientWidth - 2;
      prevBtn.disabled = track.scrollLeft <= 2;
      nextBtn.disabled = track.scrollLeft >= max;
    }
    prevBtn.addEventListener('click', function(){ doScroll(-1); });
    nextBtn.addEventListener('click', function(){ doScroll(1); });
    track.addEventListener('scroll', function(){
      updatePaddles();
      if (scrollSyncTimer) clearTimeout(scrollSyncTimer);
      scrollSyncTimer = setTimeout(syncActiveFromScroll, 150);
    }, {passive:true});
    window.addEventListener('resize', updatePaddles);
    track.addEventListener('keydown', function(e){
      if(e.key === 'ArrowRight'){ e.preventDefault(); doScroll(1); }
      if(e.key === 'ArrowLeft'){ e.preventDefault(); doScroll(-1); }
    });

    document.addEventListener('visibilitychange', function(){
      if (document.hidden) stopReel();
      else if (!pauseHover && !reducedMotion) startReel();
    });

    /* SEO: VideoObject ItemList structured data */
    function injectSchema(videos){
      try{
        var ld = {
          '@context':'https://schema.org', '@type':'ItemList', 'name':'Zaydio Shorts',
          'itemListElement': videos.map(function(v,i){
            return { '@type':'ListItem', 'position': i+1, 'item': {
              '@type':'VideoObject', 'name': v.title,
              'description': v.title + ' — a fun, family-friendly Zaydio short for kids.',
              'thumbnailUrl': 'https://i.ytimg.com/vi/' + v.id + '/oardefault.jpg',
              'contentUrl': 'https://www.youtube.com/shorts/' + v.id,
              'embedUrl': 'https://www.youtube.com/embed/' + v.id
            }};
          })
        };
        var s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(ld);
        document.head.appendChild(s);
      }catch(e){}
    }

    loadShorts().then(render);
  })();
  </script>
</section>
<!-- ============================ end Zaydio Shorts Carousel ============================ -->
